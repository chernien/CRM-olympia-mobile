name: olympia_app
description: "Application Commerciale B2B - Olympia"
publish_to: 'none'
# Le nombre après « + » est le versionCode Android. Android REFUSE toute installation
# dont le versionCode est inférieur ou égal à celui déjà présent : il doit donc croître
# à chaque livraison, sans exception. Des APK ont circulé en 2001 alors que le projet
# déclarait 1 — d'où un « INSTALL_FAILED_VERSION_DOWNGRADE » sur le téléphone de test.
# On repart au-dessus du plus haut numéro connu.
version: 1.0.0+2002

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.1
  flutter_screenutil: ^5.9.3
  fl_chart: ^1.2.0
  google_fonts: ^8.0.2

  # State Management & DI
  flutter_riverpod: ^3.1.0
  get_it: ^9.2.1

  # Functional Programming & Utils
  dartz: ^0.10.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  intl: ^0.20.2

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.7.0
  internet_connection_checker: ^3.0.1

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.5

  # Media & Files
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  cached_network_image: ^3.4.1

  # Notifications
  # FCM est le SEUL transport push du mobile : un WebSocket ne survit pas à la
  # fermeture de l'application, or le commercial est sur le terrain.
  # L'app démarre sans google-services.json (initialisation protégée par try/catch).
  firebase_core: ^4.4.0
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^21.0.0

  # Loading & Feedback
  shimmer: ^3.0.0
  flutter_svg: ^2.2.4
  country_code_picker: ^3.4.1
  confetti: ^0.8.0
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Sonde sur téléphone réel : integration_test/notification_probe_test.dart
  # déclenche le chemin d'affichage FCM sans dépendre de la livraison Google.
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # iOS et Android ancien : fond OPAQUE obligatoire. iOS refuse la transparence —
  # une zone transparente y devient noire.
  image_path: "assets/images/olyhub-icone.png"
  # Android 8+ : icone adaptative. Le lanceur applique SA forme (cercle, squircle,
  # goutte) sur l'avant-plan pose sur le fond. L'anneau seul, sans le carre bleu.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/olyhub-icone-avant-plan.png"
  # L'App Store refuse tout canal alpha, meme entierement opaque.
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  # Blank white native splash on purpose — NO logo here. The OS-level splash is
  # unavoidable, so we keep it a plain white flash that hands off seamlessly to
  # the in-app animated SplashView (the only branded splash the user sees).
  color: "#FFFFFF"
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
